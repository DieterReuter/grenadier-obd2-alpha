name       = "grenadier-signup-proxy"
main       = "worker.js"
compatibility_date = "2025-01-01"

# Route: all traffic to log.yourdomain.com goes through this worker
# Replace yourdomain.com with your actual domain in Cloudflare
[[routes]]
pattern   = "log.perlan.net/*"
zone_name = "perlan.net"

# Secret (set via CLI — never put the real token here):
#   wrangler secret put BETTERSTACK_TOKEN
